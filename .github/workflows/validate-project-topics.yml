name: Validate project repository topics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-project-topics:
    name: validate-project-topics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: pip install ruamel.yaml

      - name: Require topics on newly added repositories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/validate_project_topics.py
